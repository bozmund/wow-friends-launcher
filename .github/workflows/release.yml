name: Windows checks and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify public source boundaries
        run: python scripts/check_public.py
      - name: Format
        run: cargo fmt --check
      - name: Tests
        run: cargo test --locked
      - name: Lints
        run: cargo clippy --locked -- -D warnings
      - name: Build release
        run: cargo build --locked --release
      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/wow-friends-launcher.exe dist/wow-friends-launcher-windows-x86_64.exe
          Copy-Item LICENSE dist/LICENSE
          $hash = (Get-FileHash dist/wow-friends-launcher-windows-x86_64.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  wow-friends-launcher-windows-x86_64.exe" | Set-Content -Encoding ascii dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
